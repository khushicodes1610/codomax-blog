<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Create Blog</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <h1 class="logo">
                BlogSpace ✍️
            </h1>

            <div class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-blog.html">
                    Create Blog
                </a>

                <a href="#" id="logoutBtn">
                    Logout
                </a>

            </div>

        </nav>

    </header>


    <main class="create-blog-section">

        <div class="create-blog-card">

            <h2>
                Create a New Blog ✍️
            </h2>

            <p class="create-subtitle">
                Share your thoughts with the BlogSpace community.
            </p>


            <form id="blogForm">

                <label for="blogTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required
                >


                <label for="blogCategory">
                    Category
                </label>

                <select
                    id="blogCategory"
                    required
                >

                    <option value="">
                        Select a category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Lifestyle">
                        Lifestyle
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="blogContent">
                    Blog Content
                </label>

                <textarea
                    id="blogContent"
                    rows="10"
                    placeholder="Write your blog here..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Publish Blog 🚀
                </button>

            </form>

        </div>

    </main>


    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script src="../js/create-blog.js"></script>

</body>

</html>
