<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Register</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <h1 class="logo">BlogSpace ✍️</h1>

            <div class="nav-links">

                <a href="../index.html">Home</a>

                <a href="login.html">Login</a>

                <a href="register.html">Register</a>

            </div>

        </nav>

    </header>


    <main class="auth-section">

        <div class="auth-card">

            <h2>Create Account 🚀</h2>

            <p class="auth-subtitle">
                Join the BlogSpace community
            </p>


            <form id="registerForm">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >


                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
