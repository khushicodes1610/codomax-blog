<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <h1 class="logo">BlogSpace ✍️</h1>

            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>

        </nav>
    </header>


    <main class="auth-section">

        <div class="auth-card">

            <h2>Welcome Back 👋</h2>

            <p class="auth-subtitle">
                Login to continue to BlogSpace
            </p>


            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
